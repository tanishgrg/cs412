{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mini Insta</title>
    <link rel="stylesheet" href="{% static 'mini_insta/styles.css' %}">
</head>

<body>

    <header>
        <h1>Mini Insta</h1>
    </header>

        <nav>
            <a href="{% url 'show_all_profiles' %}">All Profiles</a>

            {% if user.is_authenticated %}
                <a href="{% url 'my_profile' %}">My Profile</a>
                <a href="{% url 'create_post' %}">Create Post</a>
                <a href="{% url 'show_feed' %}">My Feed</a>
                <a href="{% url 'search' %}">Search</a>

                <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Log Out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log In</a>
                <a href="{% url 'create_profile' %}">Create Profile</a>
            {% endif %}
        </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Mini Insta</p>
    </footer>

</body>

</html>
