{% extends 'mini_insta/base.html' %}
{% extends 'mini_insta/base.html' %}

{% block content %}

<h2>Update Profile</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save Changes</button>
</form>

<a href="{% url 'show_profile' object.pk %}">
    <button type="button">Cancel</button>
</a>

{% endblock %}
