{% extends 'mini_insta/base.html' %}

{% block content %}

<h2>Create a Post for {{ profile.username }}</h2>

<form method="POST" action="{% url 'create_post' profile.pk %}">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Create Post</button>

    <a href="{% url 'show_profile' profile.pk %}">
        Cancel
    </a>
</form>

{% endblock %}
