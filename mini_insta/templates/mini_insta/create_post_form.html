{% extends 'mini_insta/base.html' %}

{% block content %}

<h2>Create a Post for {{ profile.username }}</h2>

<form method="POST"
      action="{% url 'create_post' %}"
      enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <p>
        <label for="files">Upload Photos:</label>
        <input type="file"
               name="files"
               id="files"
               accept="image/*"
               multiple>
    </p>

    <button type="submit">Create Post</button>

    <a href="{% url 'show_profile' profile.pk %}">
        Cancel
    </a>
</form>

{% endblock %}
