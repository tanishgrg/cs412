{% extends 'mini_insta/base.html' %}

{% block content %}

<div class="search-container">
    <h2>Search Mini Insta</h2>

    <form method="GET" action="{% url 'search' profile.pk %}">
        <label for="query">Search profiles and posts:</label>

        <textarea id="query" name="query" rows="2" required></textarea>

        <button type="submit">Search</button>
    </form>

    <p>
        <a href="{% url 'show_profile' profile.pk %}">Back to Profile</a>
    </p>
</div>

{% endblock %}
